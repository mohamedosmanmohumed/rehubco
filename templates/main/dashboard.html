{% extends 'main/base.html' %}

{% block page_title %}Dashboard{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[400px] relative z-10">
    <div class="text-center">
        <div class="w-24 h-24 gradient-bg rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-2xl shadow-primary-500/30 animate-float">
            <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>
        <h2 class="text-4xl font-bold gradient-text mb-3">Welcome to Rehubco Enterprise Operations OS</h2>
        <p class="text-gray-500 dark:text-gray-400 mb-8 text-lg">Select a department portal from the sidebar or use the role switcher above</p>
        <a href="{% url 'executive_dashboard' %}" class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-primary-500 to-accent-500 hover:from-primary-600 hover:to-accent-600 text-white rounded-2xl font-semibold transition-all duration-300 shadow-xl shadow-primary-500/30 hover:shadow-2xl hover:shadow-primary-500/40 hover:scale-105">
            Go to Executive Dashboard
            <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
        </a>
    </div>
</div>
{% endblock %}
